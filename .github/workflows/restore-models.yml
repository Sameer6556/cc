# One-off repair of the model Releases. Retrains the student exactly as train.yml did (same data, same pinned
# libraries, the base-model revision of the original run) and uploads model.safetensors to the existing Release
# model-<version> only if it matches the committed models/<version>/model.sha256 byte for byte.
# Nothing is committed and no Release is created by this workflow.
name: restore-models

on:
  workflow_dispatch:
    inputs:
      versions:
        description: "versions to rebuild, separated by spaces"
        default: "v1 v2"

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Training environment
        run: make venv-train
      - name: Same data and base model as the original run
        run: |
          (cd datasets/v1 && sha256sum -c train.sha256)
          sed -i 's/^base_model_revision:.*/base_model_revision: a39f36b100fe8a5377810d56c3f4789b9c53ac42/' training/config.yaml
          grep '^base_model_revision' training/config.yaml
          lscpu | grep -E 'Model name|^CPU\(s\)'
      - name: Retrain, compare with the committed checksum, upload only an identical file
        env:
          GH_TOKEN: ${{ github.token }}
          VERSIONS: ${{ inputs.versions }}
        run: |
          for v in $VERSIONS; do
            make train MODEL_VERSION=$v > train_$v.log 2>&1 || { tail -20 train_$v.log; exit 1; }
            expected=$(awk '$2 == "model.safetensors" {print $1}' models/$v/model.sha256)
            got=$(sha256sum artifacts/models/$v/model.safetensors | cut -d' ' -f1)
            echo "$v expected: $expected"
            echo "$v rebuilt:  $got"
            if [ "$expected" != "$got" ]; then
              echo "$v: DIFFERENT from the original, nothing uploaded"
              continue
            fi
            echo "$v: IDENTICAL to the original"
            for i in $(seq 1 90); do
              gh release view "model-$v" > /dev/null 2>&1 && break
              echo "waiting for the Release model-$v to be created ($i)"
              sleep 60
            done
            gh release upload "model-$v" artifacts/models/$v/model.safetensors --clobber
            echo "$v: uploaded model.safetensors to the Release model-$v"
          done
